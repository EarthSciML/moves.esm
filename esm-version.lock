# The EarthSciAST commit that ./esm was built from.
#
# ./esm itself is untracked (CLAUDE.md); this file is the checked-in record of
# which upstream tree produced it, so a failure can be attributed to a specific
# EarthSciAST revision rather than to "whatever was on main that day".
#
# Rebuild with:
#   cargo build --release --features esio,parallel --bin esm \
#     --manifest-path ../EarthSciAST/pkg/earthsci-ast-rs/Cargo.toml
#   cp ../EarthSciAST/pkg/earthsci-ast-rs/target/release/esm ./esm
#
# The esio feature is what makes `data_sources` load; without it the fixture
# comparison stage passes vacuously, having read no data at all.

