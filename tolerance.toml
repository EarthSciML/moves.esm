# Numerical tolerances for comparing this implementation's output against the
# `moves.rs` characterization snapshots.
#
# Why this file is not a copy of `moves.rs/characterization/tolerance.toml`:
# that file encodes a *byte-identity* contract (`default_float_tolerance = 0.0`)
# for diffing two runs of the same binary against the same container image. It
# is the wrong gate for us, and `moves.rs` says so itself — its own full-suite
# regression gate (`crates/moves-cli/tests/full_suite_regression.rs`,
# `canonical_snapshot_diff`) deliberately bypasses that file, because a
# cell-level diff of MOVESOutput is unusable across implementations: the two
# tables disagree on metadata and labeling columns that carry no mass
# (`iterationID`, `roadTypeID`, the SCC road-type subfield) and on which
# uncertainty columns are even present.
#
# So we mirror the gate that actually runs there: per-pollutant `emissionQuant`
# sums, compared with a relative tolerance. Those constants are defined in-test
# in `moves.rs` and justified per fixture in its `docs/known-divergences.md`
# (§1b, §4.2).
#
# A second, tighter reason for a floor under NONROAD: `moves.rs`'s NONROAD port
# is deliberately `f32` throughout to stay bit-identical to the Fortran `real*4`
# reference, and preserves Fortran associativity operation by operation
# (`crates/moves-nonroad/src/emissions/exhaust.rs`, "Numerical-fidelity
# policy"). EarthSciAST evaluates in binary64 and its `Float32` element type is
# document-wide, so per-expression single-precision rounding is not
# reproducible. Divergence here is expected and bounded, not a bug to chase.

[default]
# Relative tolerance on per-pollutant emissionQuant sums.
onroad = 1e-3
nonroad = 1e-2

# Row-level structural checks are exact regardless of the float tolerance:
# the set of (pollutantID, processID, sourceTypeID/SCC, time) keys emitted must
# match the snapshot exactly, and row counts must be equal.
[structure]
require_exact_key_set = true
require_exact_row_count = true

# Per-cell relative tolerance, applied in addition to the sums gate above.
# Measured drift on nr-logging-county is 5-7e-6, so 2e-5 is a real gate; the
# 1e-2 that moves.rs applies to per-pollutant sums is loose enough to hide, for
# instance, a swapped 2-stroke/4-stroke oxygenate coefficient.
[cell]
rel = 2e-5

# Per-fixture overrides go here as fixtures land, each with a one-line
# justification. An override without a reason is a bug being hidden.
#
#   [fixtures."<name>"]
#   rel = 2e-2
#   why = "..."

# nr-logging-county needs NO override, and that is a deliberate finding rather
# than an omission. Evaluating this fixture in binary64 instead of the f32 the
# Fortran uses drives four cells --- (THC, CO, NOx, PM) x SCC 2260007005 x
# modelYear 2018 --- to exactly zero, because a 1-ulp difference in
# `1 - yryrfrcscrp` propagates through 30 age-distribution iterations until a
# `modfrc <= 0` skip changes sides (PLAN.md 1.6.1). They carry 2.4e-5 g out of
# 5,146 g, so per-pollutant sums still agree to 2.6e-6.
#
# The structural risk is real but is a PRECISION question, not a tolerance one,
# and an earlier version of this comment got the resolution wrong. It said the
# .esm should emit every key its joins produce rather than copying Fortran's
# row suppression. Measured, that is false:
#
#     skip predicate        float32   float64
#     modfrc <= 0  (ref)      144       140
#     modfrc <  0             188       188
#     no skip at all          188       188
#
# The skip is load-bearing: it removes 44 keys, because 44 age cohorts have
# `modfrc` EXACTLY zero. Dropping it, or relaxing it to `< 0`, over-emits by 44.
# `docs/nonroad-logging-county.md` §7.3 says the same and rejects both.
#
# The true statement is narrower. Only ONE cohort is borderline --- SCC
# 2260007005 / modelYear 2018, where f32 leaves 5.96e-08 and binary64 leaves
# exactly 0.0 --- and nothing written in-document can tell those two apart,
# because 44 other cohorts are legitimately exactly 0. So the .esm must keep
# the `modfrc <= 0` skip exactly as the reference writes it, and the four rows
# are recovered by evaluating in f32, not by changing the predicate.
#
# That is why `domain.element_type: "Float32"` has to be honoured. It is
# currently ignored --- a document declaring it computes in binary64 anyway,
# verified with every operand a runtime parameter so constant folding cannot
# explain it, and there is no cast operator either. Fixing that upstream is the
# chosen route (PLAN.md 1.6.1); the independent oracle confirms a full-f32
# evaluation reproduces all 144 rows at 4.897e-06.
#
# Do not weaken `require_exact_key_set` to accommodate any of this.

# --- which columns mean what ------------------------------------------------
#
# Read by compare-output.py. Named here rather than hardcoded so that a change
# to the comparison contract is a reviewable diff in the file that already
# documents the contract, not a silent edit to a script.

[compare]
# The columns whose values are compared numerically.
value_columns = ["emissionQuant"]

# Present in MOVESOutput but never compared: the two tables legitimately
# disagree on them and they carry no mass. `emissionQuantMean` and
# `-Sigma` are the uncertainty columns MOVES leaves NULL on a deterministic
# run; `MOVESRunID` and `iterationID` label the run, not the quantity;
# `roadTypeID` is a labeling column that (per moves.rs's own
# `canonical_snapshot_diff`) the two implementations do not agree on.
ignored_columns = [
  "MOVESRunID", "iterationID", "roadTypeID",
  "emissionQuantMean", "emissionQuantSigma",
]

# Everything else is identity: two rows are the same row iff they agree on all
# of it. Left implicit rather than listed, so a column ADDED to the output
# schema joins the key by default and has to be explicitly excused above --
# failing loudly is the right default for an unrecognised column.

# The pollutant column, for the per-pollutant sums gate.
pollutant_column = "pollutantID"

# --- recorded shortfall -----------------------------------------------------
#
# What the fixture comparison is EXPECTED to fail with today, and why. This is
# not a tolerance and it is not an excuse: `compare-output.py` still fails, and
# run-tests.sh reports the stage as green only while the failure is EXACTLY the
# one recorded here. A shortfall that grows is a regression; a shortfall that
# shrinks is progress that has to be recorded, in the same polarity as the
# known-limitations tripwire.
#
# Read by run-tests.sh, not by compare-output.py -- the comparator's own verdict
# stays unconditional, because a comparator that can be told to pass is not a
# comparator.

[shortfall."nr-logging-county"]
emitted_rows = 12
missing_keys = 132
extra_keys = 0
why = "The fixture computes ONE of the snapshot's three SCCs: 2260007005, the twelve rows of docs/nonroad-logging-county.md 6.1. All twelve agree with MOVESOutput to 4.0e-06 relative. The missing 132 are 2265007015 (16 rows, two equipment points summed into each output row) and 2265007010 (116 rows, three equipment points and a 38-year nyrlif). Widening to them is not more .esm of the same kind: each needs its own agedist result, and agedist.f's thirty-year fold is a recurrence the format cannot express (docs/findings F12), so the grown model-year fractions enter as data. One SCC's three values are checkable against the growth ratio this document derives independently; thirty-six cohorts' would be transcribing the reference's answer. F12 is the blocker, not authoring effort."
