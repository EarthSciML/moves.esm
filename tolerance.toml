# Numerical tolerances for comparing this implementation's output against the
# `moves.rs` characterization snapshots.
#
# Why this file is not a copy of `moves.rs/characterization/tolerance.toml`:
# that file encodes a *byte-identity* contract (`default_float_tolerance = 0.0`)
# for diffing two runs of the same binary against the same container image. It
# is the wrong gate for us, and `moves.rs` says so itself — its own full-suite
# regression gate (`crates/moves-cli/tests/full_suite_regression.rs`,
# `canonical_snapshot_diff`) deliberately bypasses that file, because a
# cell-level diff of MOVESOutput is unusable across implementations: the two
# tables disagree on metadata and labeling columns that carry no mass
# (`iterationID`, `roadTypeID`, the SCC road-type subfield) and on which
# uncertainty columns are even present.
#
# So we mirror the gate that actually runs there: per-pollutant `emissionQuant`
# sums, compared with a relative tolerance. Those constants are defined in-test
# in `moves.rs` and justified per fixture in its `docs/known-divergences.md`
# (§1b, §4.2).
#
# A second, tighter reason for a floor under NONROAD: `moves.rs`'s NONROAD port
# is deliberately `f32` throughout to stay bit-identical to the Fortran `real*4`
# reference, and preserves Fortran associativity operation by operation
# (`crates/moves-nonroad/src/emissions/exhaust.rs`, "Numerical-fidelity
# policy"). EarthSciAST now honours `element_type` per operation, and
# `fixtures/nr-logging-county.esm` declares `Float32`, so single-precision
# ROUNDING is reproduced. What is still not reproduced is the reference's
# per-expression ASSOCIATIVITY: the .esm writes the roll-up as one product and
# the runtime is free to order it. Measured, the whole remaining gap between
# this document's float32 answer and its binary64 one -- rounding order and
# accumulated rounding together, not separable from here -- is at most 1.13e-07
# relative on the twelve emitted cells, and the worst cell against MOVESOutput
# moved from 4.025e-06 to 4.046e-06. Divergence here is expected and bounded,
# not a bug to chase.

[default]
# Relative tolerance on per-pollutant emissionQuant sums.
onroad = 1e-3
nonroad = 1e-2

# Row-level structural checks are exact regardless of the float tolerance:
# the set of (pollutantID, processID, sourceTypeID/SCC, time) keys emitted must
# match the snapshot exactly, and row counts must be equal.
[structure]
require_exact_key_set = true
require_exact_row_count = true

# Per-cell relative tolerance, applied in addition to the sums gate above.
# Measured drift on nr-logging-county is 5-7e-6, so 2e-5 is a real gate; the
# 1e-2 that moves.rs applies to per-pollutant sums is loose enough to hide, for
# instance, a swapped 2-stroke/4-stroke oxygenate coefficient.
#
# The same 2e-5 was arrived at INDEPENDENTLY for the onroad side
# (docs/mixed-onroad.md 7.4) and the five wired fixtures now sit at 4.561e-06,
# 7.294e-06, 7.495e-06, 8.320e-06 and 8.250e-06 -- so the gate carries about 2.4x
# headroom over the worst of them and the constraint in every case is the
# reference's six-significant-figure column storage rather than either
# implementation. It has not been widened for any fixture.
#
# process-brakewear is the widest of the five at 750 rows over three pollutants,
# and its worst cell is the PM10 block's -- which is arithmetically boring: PM10
# is the PM2.5 block times a stored PM10PM25Ratio, so it carries the PM2.5
# residual plus that ratio's own quantisation. docs/process-brakewear.md 7.1.
[cell]
rel = 2e-5

# Per-fixture overrides go here as fixtures land, each with a one-line
# justification. An override without a reason is a bug being hidden.
#
#   [fixtures."<name>"]
#   rel = 2e-2
#   why = "..."

# nr-logging-county needs NO override, and that is a deliberate finding rather
# than an omission. In a chain that EXECUTES scrptime and agedist, evaluating in
# binary64 instead of the f32 the Fortran uses drives four cells --- (THC, CO,
# NOx, PM) x SCC 2260007005 x modelYear 2018 --- to exactly zero, because a
# 1-ulp difference in `1 - yryrfrcscrp` propagates through 30 age-distribution
# iterations until a `modfrc <= 0` skip changes sides (PLAN.md 1.6.1). They
# carry 2.4e-5 g out of 5,146 g, so per-pollutant sums still agree to 2.6e-6.
#
# THAT PARAGRAPH USED TO SAY IT WITHOUT THE QUALIFIER, ABOUT THE FIXTURE ITSELF,
# AND THAT WAS WRONG WHEN WRITTEN --- AND IS NOW TRUE. It was true of
# `run-oracle.sh`, which executes the fold, and false of
# `fixtures/nr-logging-county.esm`, which carried the fold's OUTPUT as a const
# `[3.7072685, 0.9905483, 5.8885583e-08]`. The borderline cohort therefore
# arrived already positive and `age_isPopulated` read it as populated in either
# precision: the fixture had float32's ROW SET without having needed float32's
# ARITHMETIC to get it.
#
# THE FIXTURE NOW EXECUTES THE FOLD, so the qualifier is gone and the sentence
# above applies to it directly. agedist.f's thirty-year recurrence is spelled as
# esm-spec 4.3.1.1's causal self-reference (EarthSciAST a83cde55e) and evaluated
# here over all six equipment points; all 306 grown fractions are bit-identical
# to the reference's real*4 values, and the three this SCC needs come out at
# 3.707268476486206, 0.990548312664032 and 5.888558263222876e-08 --- which ARE
# binary32's 3.7072685, 0.9905483 and 5.8885583e-08, to the last bit. The row
# set is now PRODUCED by the declared element type instead of resting on a
# constant that was typed in, which is what makes the precision paragraph above
# load-bearing rather than decorative.
#
# What was blocking it was finding F24, and then F25/F26 behind it --- all three
# the same unbound-name arm returning a NaN that agedist.f's own `max(., 0)`
# laundered into a plausible number (measured at the time: grown fractions
# summing to 1.5e-06 instead of 4.697819). All are fixed upstream and the pin
# carries them (`esm-version.lock`: EarthSciAST a1dc9bb30). The ingestion axis
# the upstream build could not reach --- it has no parquet feature --- is
# verified here instead, by the two controls in docs/findings/ and by this
# fixture computing the fold while reading the real snapshot.

# The structural risk is real but is a PRECISION question, not a tolerance one,
# and an earlier version of this comment also got the resolution wrong. It said
# the .esm should emit every key its joins produce rather than copying Fortran's
# row suppression. Measured, that is false:
#
#     skip predicate        float32   float64
#     modfrc <= 0  (ref)      144       140
#     modfrc <  0             188       188
#     no skip at all          188       188
#
# The skip is load-bearing: it removes 44 keys, because 44 age cohorts have
# `modfrc` EXACTLY zero. Dropping it, or relaxing it to `< 0`, over-emits by 44.
# `docs/nonroad-logging-county.md` §7.3 says the same and rejects both.
#
# The true statement is narrower. Only ONE cohort is borderline --- SCC
# 2260007005 / modelYear 2018, where f32 leaves 5.96e-08 and binary64 leaves
# exactly 0.0 --- and nothing written in-document can tell those two apart,
# because 44 other cohorts are legitimately exactly 0. So the .esm must keep
# the `modfrc <= 0` skip exactly as the reference writes it, and a chain that
# computes the fold recovers the four rows by evaluating in f32, not by changing
# the predicate.
#
# That is why `domain.element_type: "Float32"` had to be honoured, and it now
# is, per operation, with a per-variable override for the keys binary32 cannot
# represent (finding F18). The fixture declares both: `Float32` document-wide
# and `Float64` on the nineteen SCC-valued variables. The independent oracle
# confirms a full-f32 evaluation reproduces all 144 rows at 4.897e-06. The
# element type is a prerequisite for the OTHER two SCCs, whose folds are not
# carried; it is not what produced this one's twelve rows.
#
# Do not weaken `require_exact_key_set` to accommodate any of this.

# --- which columns mean what ------------------------------------------------
#
# Read by compare-output.py. Named here rather than hardcoded so that a change
# to the comparison contract is a reviewable diff in the file that already
# documents the contract, not a silent edit to a script.

[compare]
# The columns whose values are compared numerically.
value_columns = ["emissionQuant"]

# Present in MOVESOutput but never compared: the two tables legitimately
# disagree on them and they carry no mass. `emissionQuantMean` and
# `-Sigma` are the uncertainty columns MOVES leaves NULL on a deterministic
# run; `MOVESRunID` and `iterationID` label the run, not the quantity;
# `roadTypeID` is a labeling column that (per moves.rs's own
# `canonical_snapshot_diff`) the two implementations do not agree on.
ignored_columns = [
  "MOVESRunID", "iterationID", "roadTypeID",
  "emissionQuantMean", "emissionQuantSigma",
]

# Everything else is identity: two rows are the same row iff they agree on all
# of it. Left implicit rather than listed, so a column ADDED to the output
# schema joins the key by default and has to be explicitly excused above --
# failing loudly is the right default for an unrecognised column.

# The pollutant column, for the per-pollutant sums gate.
pollutant_column = "pollutantID"

# --- recorded shortfall -----------------------------------------------------
#
# What a fixture comparison is EXPECTED to fail with today, and why. This is
# not a tolerance and it is not an excuse: `compare-output.py` still fails, and
# run-tests.sh reports the stage as green only while the failure is EXACTLY the
# one recorded here. A shortfall that grows is a regression; a shortfall that
# shrinks is progress that has to be recorded, in the same polarity as the
# known-limitations tripwire.
#
# Read by run-tests.sh, not by compare-output.py -- the comparator's own verdict
# stays unconditional, because a comparator that can be told to pass is not a
# comparator.
#
# THERE ARE NONE. `nr-logging-county` emitted twelve of the snapshot's 144 rows
# for as long as `fixtures/nr-logging-county.esm` computed one of the run's six
# nrsourceusetype equipment points. It now computes all six, over the three
# SCCs they carry, and the comparison PASSES: 144 rows, the key set identical,
# worst cell 4.561e-06 relative against MOVESOutput and worst per-pollutant sum
# 2.079e-06. The record is deleted rather than relaxed, and run-tests.sh fails
# with instructions if a shortfall record is ever left behind a comparison that
# has started passing.
#
# The two things that had to be true for the ragged 36-cohort key set to come
# out of a format with no usable ragged index set (docs/findings F14) are worth
# naming here, because they are what `require_exact_key_set` is now testing:
# the cohorts live on a RECTANGULAR 6 x 51 grid of (equipment point, age slot)
# with `slot_isPopulated` as the mask, and `cohort_ownerRank` -- an inclusive
# prefix count over the mask -- compacts the survivors onto the flat 144-row
# output relation. 36 is not written down anywhere; it is what the mask counts.
